<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Peter Canning — Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://kit.fontawesome.com/1a45e8f5b7.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --surface: #f7f7f7;
      --border: #e2e2e2;
      --text: #111111;
      --text-muted: #888888;
      --accent: #2563eb;
      --tag-bg: rgba(37,99,235,0.07);
      --tag-border: rgba(37,99,235,0.2);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      background-position: left;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      background-image: url('images/photos/AI_structure.png');
      background-repeat: no-repeat;
      background-size: cover;
      background-position: left;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2.5rem;
      height: 60px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-name {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 300;
      font-size: 1.15rem;
      letter-spacing: 0.04em;
      color: var(--text);
      text-decoration: none;
    }

    .nav-links { display: flex; gap: 2rem; }
    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--accent); }

    /* ── HERO HEADER ── */
    .page-header {
      padding: 120px 2.5rem 48px;
      border-bottom: 1px solid var(--border);
      background-color: rgba(255,255,255,0.5);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }

    .page-header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 300;
      font-size: clamp(2.8rem, 6vw, 5rem);
      line-height: 1;
      letter-spacing: -0.01em;
      margin-bottom: 0.6rem;
    }

    .page-header .sub {
      color: var(--text-muted);
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .page-header .sub a {
      color: var(--accent);
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .page-header .sub a:hover { opacity: 0.7; }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 2rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 2rem;
    }

    footer span {
      color: var(--text-muted);
      font-size: 0.62rem;
      letter-spacing: 0.1em;
    }

    footer a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
    footer a:hover { color: var(--accent); }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-name">Peter Canning</a>
    <div class="nav-links">

      <a href="code.html">Code</a>

    </div>
  </nav>

  </header>

</body>
</html>
